# Cross-platform Electron installers for pandda-inspect (ROADMAP #6).
#
# Each OS in the matrix builds its OWN artifacts end-to-end — the PyInstaller
# freeze is per-OS (it bundles a native Python + the compiled gemmi wheel), so
# mac/win/linux binaries cannot be cross-built; the runner's OS IS the target.
#
# Pipeline per runner:
#   1. build the React/Moorhen client  (client/dist) — bundled into the freeze
#      and served same-origin by the backend;
#   2. freeze the Django backend with PyInstaller -> dist/pandda-inspect-backend;
#   3. smoke the freeze with --selfcheck (gemmi callable + DB migrates);
#   4. electron-builder -> installers, bundling the binary as an extraResource.
name: electron

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The release job needs write access to create a GitHub Release + upload assets.
# (Read is the default; only the release job actually uses write.)
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Hoist the signing secret to a job-level env so step `if:` can test it
    # (step conditions can read `env.` but NOT `secrets.` directly). Empty when
    # the secret is unset (forks/PRs) -> the unsigned path runs.
    env:
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' }}

    steps:
      - uses: actions/checkout@v4

      # Detect whether this change touches anything that needs a build. A
      # docs/lockfile-only PR short-circuits the expensive client build +
      # PyInstaller freeze + electron-builder and finishes green in ~30s — but
      # the job STILL RUNS and reports, so the branch-protection required checks
      # (build (*-latest)) are satisfied without skipping the job entirely
      # (a skipped required check blocks merge under branch protection).
      # Only applies on pull_request; main/tag pushes always build fully so a
      # release is never short-circuited.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # `code` is true when ANY changed file is NOT a markdown file. A PR
          # that touches only *.md (READMEs, docs/) yields code=false and the
          # build short-circuits. Anything else (a .py, .ts, .json, the
          # workflow itself, an image…) flips code=true and the full build runs.
          filters: |
            code:
              - '!**/*.md'

      - name: Docs-only change — skipping build
        if: >-
          github.event_name == 'pull_request' &&
          steps.changes.outputs.code == 'false'
        run: |
          echo "Only docs/markdown changed — skipping client build, backend"
          echo "freeze, and packaging. (This check still reports success so"
          echo "branch protection is satisfied.)"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        with:
          python-version: "3.12"

      # --- 1. build the client (client/dist) -------------------------------
      # copy:assets pulls Moorhen WASM + RDKit out of node_modules into public/;
      # `npm run build` then emits the static SPA the backend serves.
      - name: Build client
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        working-directory: client
        run: |
          npm ci
          npm run build

      # --- 2. freeze the backend (dist/pandda-inspect-backend) -------------
      - name: Install backend + packaging deps
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt

      - name: Freeze backend (PyInstaller)
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        run: pyinstaller packaging/backend.spec --noconfirm

      # --- 3. smoke the freeze ---------------------------------------------
      - name: Selfcheck frozen backend (unix)
        if: (steps.changes.outputs.code == 'true' || github.event_name != 'pull_request') && runner.os != 'Windows'
        run: ./dist/pandda-inspect-backend --selfcheck

      - name: Selfcheck frozen backend (windows)
        if: (steps.changes.outputs.code == 'true' || github.event_name != 'pull_request') && runner.os == 'Windows'
        run: ./dist/pandda-inspect-backend.exe --selfcheck

      # --- 4. package the Electron installers ------------------------------
      - name: Install electron deps
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        run: npm ci

      # macOS — SIGNED build (only when the signing secret exists). An *empty*
      # CSC_LINK (an unset secret expands to "") makes electron-builder treat it
      # as a cert path and fail with "… not a file"; gating on the secret being
      # non-empty avoids that and signs + notarizes (electron/notarize.js runs
      # when APPLE_* are present). See packaging/README.md.
      - name: Build installers — macOS (signed)
        if: (steps.changes.outputs.code == 'true' || github.event_name != 'pull_request') && runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish never

      # macOS — UNSIGNED fallback (forks/PRs with no secrets). No CSC_* env at
      # all, so there's no empty cert path to choke on; produces the
      # right-click-Open artifact.
      - name: Build installers — macOS (unsigned)
        if: (steps.changes.outputs.code == 'true' || github.event_name != 'pull_request') && runner.os == 'macOS' && env.HAS_SIGNING != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      # Windows/Linux build deliberately carries NO CSC_* env. An *empty* CSC_LINK
      # (which is what an unset secret expands to) makes electron-builder on
      # Windows try to resolve it as a cert path and FAIL ("Env WIN_CSC_LINK is
      # not correct, cannot resolve …"). Omitting the var entirely is the fix —
      # these platforms aren't signed yet anyway.
      - name: Build installers — Windows/Linux
        if: (steps.changes.outputs.code == 'true' || github.event_name != 'pull_request') && runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - name: Upload installers
        if: steps.changes.outputs.code == 'true' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  # --- 5. publish a GitHub Release (only on a v* tag) ----------------------
  # Collects every OS's installers from the matrix build and attaches them to a
  # single Release. Pushing a tag (git tag v0.1.0 && git push origin v0.1.0)
  # gives a stable download page to send Erin — no GitHub login needed if the
  # repo is public; collaborators can grab it either way.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: false
          prerelease: true
          generate_release_notes: true
          # Unsigned builds — tell users how to get past Gatekeeper/SmartScreen.
          body: |
            ### Reinspect — prototype build

            An independent prototype reimagining the **pandda.inspect**
            event-review workflow. *Not affiliated with or endorsed by the
            PanDDA project* — a fresh, exploratory client, not the official tool.

            **Downloads:** macOS `.dmg` (Apple-silicon), Windows `.exe`, Linux
            `.AppImage`/`.deb` are attached below.

            > These prototype builds are **not code-signed/notarized yet**, so
            > the OS will warn on first launch:
            > - **macOS:** right-click the app → **Open** → **Open** (once), or
            >   run `xattr -dr com.apple.quarantine "/Applications/Reinspect.app"`.
            > - **Windows:** SmartScreen → **More info** → **Run anyway**.
            >
            > They are otherwise complete: the app starts its own backend and
            > opens the inspector. Data is stored per-user; on first run it's
            > empty — use **Import** to add a PanDDA dataset.
